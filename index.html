    <script>
      // Aplica o tema salvo (ou o do sistema) antes do primeiro paint — evita flash branco.
      (function () {
        try {
          var t = localStorage.getItem('retoma.theme');
          if (
            t === 'dark' ||
            (t !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
